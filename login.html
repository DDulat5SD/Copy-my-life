<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CopyMyLife</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="page">
    <div class="auth-card">

      <div class="form-panel">
        <div class="brand">
<a href="https://ibb.co.com/LdBNgmvJ"><img src="https://i.ibb.co.com/gZQ4WN6P/image.png" alt="image"></a>
          <span class="brand-name">CopyMyLife</span>
        </div>

        <div class="form-content">
          <h1>Welcome back</h1>
          <p class="subtitle">Continue building the routines that move you forward.</p>

          <div class="divider"><span>or continue with email</span></div>

          <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">

            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Enter your password">
              <button type="button" class="eye-toggle" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M2 2l20 20"/>
                  <path d="M9.9 5.1A9.7 9.7 0 0 1 12 5c5 0 9 4.5 10 7-0.4 1-1.1 2.2-2.1 3.3M6.7 6.7C4.7 8.1 3.3 10 2 12c1 2.5 5 7 10 7 1.5 0 2.9-.4 4.1-1"/>
                  <path d="M9.5 9.6a3 3 0 0 0 4.2 4.2"/>
                </svg>
              </button>
            </div>

            <div class="row-between">
              <label class="checkbox">
                <input type="checkbox">
                <span>Remember me</span>
              </label>
              <a href="#" class="link">Forgot password?</a>
            </div>

            <button type="submit" class="primary-btn">Sign in</button>
          </form>

          <p class="switch-text">Don't have an account? <a href="signin.html" class="link-strong">Sign up</a></p>
        </div>

        <p class="footnote">Small habits, thoughtfully repeated.</p>
      </div>

      <div class="photo-panel">
        <img src="https://i.pinimg.com/736x/ad/69/60/ad6960d58e6cded5745d723c10a51c0e.jpg" alt="Aim High" class="profile-photo">
      </div>

    </div>
  </div>
  <script>
  document.querySelectorAll('a[href]').forEach(link => {
    const href = link.getAttribute('href');

    if (href && href !== '#' && !href.startsWith('http')) {
      link.addEventListener('click', function (e) {
        e.preventDefault();

        document.body.classList.add('page-exit');

        setTimeout(() => {
          window.location.href = href;
        }, 350);
      });
    }
  });
</script>
</body>
</html>
