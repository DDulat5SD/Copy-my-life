
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit — CopyMyLife Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-detail.css">
</head>
<body>

<header class="topbar">
    <a href="admin-dashboard.html" class="brand">
        <img src="https://i.ibb.co/chRY80xC/image.png" alt="">
        <span>CopyMyLife</span>
    </a>
    <a id="backLink" class="back-link" href="admin-users.html">← Back to Profile</a>
</header>

<div class="page">
    <aside class="sidebar">
        <div class="owner-card">
            <div id="ownerAvatar" class="owner-avatar">?</div>
            <h2 id="ownerName" class="owner-name">Loading...</h2>
            <p id="ownerUsername" class="owner-meta"></p>
            <p id="ownerEmail" class="owner-meta"></p>
            <a id="ownerLink" class="owner-link" href="admin-users.html">View Profile</a>
        </div>

        <div class="side-nav">
            <a href="#details" class="side-link active">
                <span class="side-icon purple">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 6 9 17l-5-5"/>
                    </svg>
                </span>
                Habit Details
                <span class="side-arrow">›</span>
            </a>

            <a href="#routines" class="side-link">
                <span class="side-icon yellow">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="16" rx="2"/>
                        <path d="M8 3v4M16 3v4M3 10h18"/>
                    </svg>
                </span>
                Used in Routines
                <span class="side-arrow">›</span>
            </a>
        </div>
    </aside>

    <main class="content">
        <div class="heading">
            <h1 id="title">Loading habit...</h1>
            <p>Habit information and related routines</p>
        </div>

        <div id="error"></div>

        <section class="panel" id="details">
            <div class="panel-heading">
                <span class="side-icon purple">✓</span>
                <h2>Habit Information</h2>
            </div>
            <div id="info"></div>
        </section>

        <section class="panel" id="routines">
            <div class="panel-heading">
                <span class="side-icon yellow">▦</span>
                <h2>Used in Routines</h2>
            </div>
            <div id="routineList" class="cards"></div>
        </section>
    </main>
</div>

<script>
    const token = sessionStorage.getItem("adminToken");
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const userId = params.get("userId");
    const $ = value => document.getElementById(value);

    if (!token) location.replace("admin-login.html");

    if (userId && /^\d+$/.test(userId)) {
        $("backLink").href = `admin-profile.html?id=${userId}`;
        $("ownerLink").href = `admin-profile.html?id=${userId}`;
    }

    function row(label, value) {
        const element = document.createElement("div");
        element.className = "info-row";

        const left = document.createElement("span");
        left.className = "info-label";
        left.textContent = label;

        const right = document.createElement("span");
        right.className = "info-value";
        right.textContent = value ?? "—";

        element.append(left, right);
        $("info").appendChild(element);
    }

    async function load() {
        if (!id || !/^\d+$/.test(id)) {
            $("error").textContent = "Invalid habit ID";
            return;
        }

        try {
            const response = await fetch("/admin-api/habits/" + id, {
                headers: { Authorization: "Bearer " + token }
            });

            if (response.status === 401 || response.status === 403) {
                location.replace("admin-login.html");
                return;
            }

            if (!response.ok) {
                throw new Error("Failed to load habit: " + response.status);
            }

            const habit = await response.json();

            $("title").textContent = habit.title || "Habit";
            $("ownerName").textContent = habit.ownerName || "User";
            $("ownerUsername").textContent = habit.ownerUsername
                ? "@" + habit.ownerUsername : "";
            $("ownerEmail").textContent = habit.ownerEmail || "";
            $("ownerAvatar").textContent =
                (habit.ownerName || "?")[0].toUpperCase();

            $("ownerLink").href = `admin-profile.html?id=${habit.ownerId}`;

            row("Habit ID", habit.id);
            row("Title", habit.title);
            row("Description", habit.description);
            row("Duration", (habit.durationMinutes || 0) + " minutes");
            row("Linked occurrences", habit.linkedOccurrences);
            row("Completion history", habit.hasHistory ? "Yes" : "No");
            row("Saved by users", habit.savedByUsers ? "Yes" : "No");

            const root = $("routineList");

            if (!habit.routineIds || habit.routineIds.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "This habit is not linked to any routine.";
                root.appendChild(empty);
                return;
            }

            habit.routineIds.forEach(routineId => {
                const card = document.createElement("article");
                card.className = "detail-card";

                const title = document.createElement("h3");
                title.textContent = "Routine #" + routineId;

                const link = document.createElement("a");
                link.className = "detail-action";
                link.textContent = "Show Routine →";
                link.href = `admin-routine-view.html?id=${routineId}&userId=${habit.ownerId}`;

                card.append(title, link);
                root.appendChild(card);
            });

        } catch (error) {
            $("error").textContent = error.message;
        }
    }

    load();
</script>
</body>
</html>
